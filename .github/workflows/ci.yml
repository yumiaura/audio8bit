name: CI

# Runs on every push to main and on pull requests. Builds the package, runs the
# test suite and smoke-tests the CLI so the build-status badge reflects the real
# state.
#
# The tests need NumPy only: Demucs, basic-pitch and librosa are imported
# lazily by the code under test, and the tests that need them stub them at the
# module boundary.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build the package
        run: |
          python -m pip install --upgrade build numpy
          python -m build

      - name: Install the test dependencies
        run: python -m pip install --upgrade pytest

      - name: Run the test suite
        run: python -m pytest

      - name: Smoke-test the CLI
        run: |
          python -c "import audio8bit; from audio8bit.cli import build_parser; build_parser(); print('audio8bit', audio8bit.version)"
